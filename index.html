<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinChat - AI Settlement Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #F1F5F9; margin: 0; height: 100vh; display: flex; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .sidebar { width: 260px; background-color: #050505; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 1rem; }
        .new-chat-btn { background-color: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; text-align: left; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }

        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
        
        .message-row { display: flex; width: 100%; max-width: 800px; margin: 0 auto; gap: 1rem; }
        .user-message { justify-content: flex-end; }
        .ai-message { justify-content: flex-start; }
        
        .avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .user-avatar { background-color: #334155; }
        .ai-avatar { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; box-shadow: 0 0 15px rgba(6,182,212,0.3); }

        .bubble { max-width: 80%; padding: 1rem 1.25rem; font-size: 0.95rem; line-height: 1.6; }
        .user-bubble { background-color: #111111; border-radius: 16px 16px 4px 16px; border: 1px solid rgba(255,255,255,0.1); }
        .ai-bubble { background-color: transparent; border-radius: 16px 16px 16px 4px; padding: 0; }

        .input-wrapper { max-width: 800px; width: 100%; margin: 0 auto; padding: 1rem 2rem 2rem 2rem; }
        .input-box { background-color: #1E293B; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.5rem; display: flex; align-items: flex-end; gap: 0.5rem; transition: border-color 0.2s; }
        .input-box:focus-within { border-color: #3b82f6; }
        
        textarea { flex: 1; background: transparent; border: none; color: white; font-family: inherit; padding: 0.5rem; resize: none; max-height: 150px; outline: none; }
        textarea::placeholder { color: #64748b; }
        
        .send-btn { background-color: #0ea5e9; color: white; border: none; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; flex-shrink: 0; margin-bottom: 4px; }
        .send-btn:hover { background-color: #0284c7; }
        .send-btn:disabled { background-color: #475569; cursor: not-allowed; }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 8px; }
        .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .toggle-trace { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 10px; width: 100%; text-align: left; }
        .toggle-trace:hover { background: #334155; color: #fff; }
        .trace-data { display: none; background: #000; color: #00ff00; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; margin-top: 5px; white-space: pre-wrap; overflow-x: auto; border: 1px solid #333; }
        .settings-btn { background: transparent; border: none; color: #94a3b8; cursor: pointer; transition: 0.2s; }
        .settings-btn:hover { color: #fff; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 50; }
        .modal-content { background: #111; border: 1px solid #333; padding: 24px; border-radius: 12px; width: 400px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-xl font-bold flex items-center justify-between mb-8 text-white">
            <div><span style="color:#f59e0b;">⚡</span> FinChat</div>
            <button class="settings-btn" onclick="document.getElementById('settingsModal').style.display='flex'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>
        <button class="new-chat-btn" onclick="location.reload()">
            <span class="text-lg">+</span> New Chat
        </button>
        <div class="mt-auto text-xs text-slate-500 pb-2">v3.0 - AI Settlement Agent</div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Configuration</h3>
            <label class="block text-sm text-slate-400 mb-2">OpenRouter API Key (Local LLM bypass)</label>
            <input type="password" id="apiKeyInput" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white mb-4 outline-none focus:border-blue-500" placeholder="sk-or-v1-...">
            <div class="flex justify-end gap-2">
                <button class="px-4 py-2 text-sm text-slate-400 hover:text-white" onclick="document.getElementById('settingsModal').style.display='none'">Cancel</button>
                <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm" onclick="saveApiKey()">Save</button>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-container" id="chatContainer">
            <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-3xl shadow-[0_0_30px_rgba(6,182,212,0.4)] mb-4">✨</div>
                <h1 class="text-3xl font-semibold">How can I help you?</h1>
                <p class="text-slate-400 max-w-md">I am securely connected to Gateway logs, Bank settlements, and internal ledgers. Ask me to trace an anomaly.</p>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="Message FinChat..." onkeydown="handleEnter(event)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
            <div class="text-center text-xs text-slate-500 mt-3">FinChat connects securely to internal ledgers and gateway databases.</div>
        </div>
    </div>

    <script>
        // Load API Key on start
        window.onload = function() {
            const savedKey = localStorage.getItem('finchat_api_key');
            if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('finchat_api_key', key);
            document.getElementById('settingsModal').style.display = 'none';
        }

        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function toggleTrace(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            const apiKey = localStorage.getItem('finchat_api_key');

            if (welcomeScreen) welcomeScreen.style.display = 'none';

            addMessage(query, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            const loaderId = 'loader-' + Date.now();
            addLoading(loaderId);

            try {
                const response = await fetch('https://finchat-c782.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, api_key: apiKey })
                });

                const data = await response.json();
                document.getElementById(loaderId).remove();
                
                addMessage(data.explanation, 'ai', data.traces);

            } catch (err) {
                document.getElementById(loaderId).remove();
                addMessage("<span style='color:#ff0000;'>❌ Error connecting to backend server. Make sure your Render server is online.</span>", 'ai');
            }
            
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, sender, traces = null) {
            const row = document.createElement('div');
            row.className = `message-row ${sender === 'user' ? 'user-message' : 'ai-message'}`;

            let avatar = sender === 'user' 
                ? `<div class="avatar user-avatar">👤</div>` 
                : `<div class="avatar ai-avatar">✨</div>`;

            let bubbleClass = sender === 'user' ? 'user-bubble' : 'ai-bubble';
            
            let traceHtml = '';
            if (traces && traces.length > 0) {
                const traceId = 'trace-' + Date.now();
                traceHtml = `
                    <div>
                        <button class="toggle-trace" onclick="toggleTrace('${traceId}')">📊 Toggle Raw JSON Data</button>
                        <div id="${traceId}" class="trace-data">${JSON.stringify(traces, null, 2)}</div>
                    </div>
                `;
            }

            row.innerHTML = `
                ${sender === 'ai' ? avatar : ''}
                <div class="bubble ${bubbleClass}">
                    <div>${text}</div>
                    ${traceHtml}
                </div>
                ${sender === 'user' ? avatar : ''}
            `;

            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoading(id) {
            const row = document.createElement('div');
            row.id = id;
            row.className = `message-row ai-message`;
            row.innerHTML = `
                <div class="avatar ai-avatar">✨</div>
                <div class="bubble ai-bubble">
                    <div class="typing-indicator">
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
